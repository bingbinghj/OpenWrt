name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */18 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: immortalwrt-update-checker
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared upstream settings
        run: cat .github/upstream.env >> "$GITHUB_ENV"

      - name: Compare with last published firmware
        id: upstream
        # A failed build never advances the baseline; the next check retries it.
        run: python3 scripts/upstream_release.py check

      - name: Trigger build when idle
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: |
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow x86_64.yml \
            --limit 100 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [[ "$active" != 0 ]]; then
            echo 'An existing firmware build is active; defer until the next check.'
            exit 0
          fi
          gh workflow run x86_64.yml --repo "$GITHUB_REPOSITORY" --ref "$WORKFLOW_REF" \
            -f "upstream_commit=$UPSTREAM_COMMIT"
