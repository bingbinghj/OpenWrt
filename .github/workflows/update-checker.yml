name: Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */18 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: immortalwrt-update-checker
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared upstream settings
        run: cat .github/upstream.env >> "$GITHUB_ENV"

      - name: Validate update checker
        run: python3 -m unittest discover -s tests -p test_upstream_release.py -v

      - name: Compare with last published firmware
        id: upstream
        # A failed build never advances the baseline; the next check retries it.
        run: python3 scripts/upstream_release.py check

      - name: Trigger build when idle
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_COMMIT: ${{ steps.upstream.outputs.upstream_commit }}
          WORKFLOW_REF: ${{ github.event.repository.default_branch }}
        run: python3 scripts/upstream_release.py dispatch
