# Based on P3TERX/Actions-OpenWrt (MIT).
name: x86_64

on:
  repository_dispatch:
    types: [Source Code Update]
  workflow_dispatch:
    inputs:
      upstream_commit:
        description: 'ImmortalWrt commit SHA; leave empty to build the configured branch tip'
        required: false
        type: string

permissions:
  contents: write

# Serial publication keeps the previous-release baseline consistent.
concurrency:
  group: immortalwrt-x86-64
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: x86_64.config
  DIY_P1_SH: x86_64_diy-part1.sh
  DIY_P2_SH: x86_64_diy-part2.sh
  UPLOAD_BIN_DIR: 'false'
  UPLOAD_FIRMWARE: 'true'
  UPLOAD_RELEASE: 'true'
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load build settings
        run: |
          cat .github/upstream.env >> "$GITHUB_ENV"
          mkdir -p logs

      - name: Validate release and customization scripts
        run: |
          python3 -m unittest discover -s tests -p 'test_*release.py' -v
          bash -n x86_64_diy-part1.sh
          bash -n x86_64_diy-part2.sh
          bash tests/test_customization.sh

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$(id -u):$(id -g)" /workdir

      - name: Clone source code
        working-directory: /workdir
        env:
          REQUESTED_COMMIT: ${{ inputs.upstream_commit || github.event.client_payload.upstream_commit }}
        run: |
          df -hT "$PWD"
          # Keep commit history for an exact changelog; fetch blobs on demand.
          git clone --filter=blob:none --single-branch --branch "$REPO_BRANCH" \
            "https://github.com/$UPSTREAM_REPOSITORY.git" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt
          if [[ -n "$REQUESTED_COMMIT" ]]; then
            [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid upstream SHA'; exit 1; }
            git cat-file -e "$REQUESTED_COMMIT^{commit}"
            git merge-base --is-ancestor "$REQUESTED_COMMIT" "origin/$REPO_BRANCH"
            git checkout --detach "$REQUESTED_COMMIT"
          fi
          git rev-parse HEAD | tee "$GITHUB_WORKSPACE/logs/upstream-commit.txt"

      - name: Load custom feeds
        run: |
          if [[ -f "$FEEDS_CONF" ]]; then cp "$FEEDS_CONF" openwrt/feeds.conf.default; fi
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P1_SH" 2>&1 | tee "$GITHUB_WORKSPACE/logs/custom-feeds.log"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-update.log"

      - name: Customize packages and configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -d files ]]; then cp -a files openwrt/; fi
          cp "$CONFIG_FILE" openwrt/.config
          cd openwrt
          bash "$GITHUB_WORKSPACE/$DIY_P2_SH" 2>&1 | tee "$GITHUB_WORKSPACE/logs/custom-packages.log"

      - name: Refresh and install customized feeds
        run: |
          cd openwrt
          # Re-index local changes without fetching over the replaced packages.
          ./scripts/feeds update -i 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-index.log"
          ./scripts/feeds install -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/feeds-install.log"
          make defconfig
          ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/logs/config.seed"
          ./scripts/feeds list -s > "$GITHUB_WORKSPACE/logs/feeds.txt"
          grep '^GO_VERSION_' feeds/packages/lang/golang/golang/Makefile

      - name: Download packages
        run: |
          cd openwrt
          if ! make download -j8 2>&1 | tee "$GITHUB_WORKSPACE/logs/download.log"; then
            make download -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/download-retry.log"
          fi

      - name: Compile the firmware
        id: compile
        run: |
          cd openwrt
          if ! make -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/logs/build.log"; then
            make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/build-retry.log"
          fi
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Prepare firmware artifacts
        id: organize
        if: success() && steps.compile.outputs.status == 'success'
        run: |
          mkdir -p firmware
          find openwrt/bin/targets/x86/64 -maxdepth 1 -type f \
            -exec cp -- '{}' "$GITHUB_WORKSPACE/firmware/" \;
          # A successful make without an image must not create an empty release.
          find firmware -maxdepth 1 -type f -name '*.img*' -print -quit | grep -q .
          echo 'status=success' >> "$GITHUB_OUTPUT"

      - name: Generate upstream release notes
        if: success() && steps.organize.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/upstream_release.py notes
          cp build-info.json firmware/
          cat release.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt-x86-64-${{ github.run_id }}-${{ github.run_attempt }}
          path: firmware/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload bin directory
        if: success() && steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-bin-${{ github.run_id }}-${{ github.run_attempt }}
          path: openwrt/bin/
          retention-days: 7
          compression-level: 0

      - name: Publish complete firmware release
        id: release
        if: success() && steps.organize.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="immortalwrt-${BUILD_TARGET}-$(date +'%Y.%m.%d-%H%M')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --draft --title "ImmortalWrt ${BUILD_TARGET} $(date +'%Y-%m-%d %H:%M')" \
            --notes-file release.md firmware/*
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Retain three managed firmware releases
        if: success() && steps.release.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python3 scripts/upstream_release.py prune --keep 3 --current-tag "$RELEASE_TAG"

      - name: Check space usage
        if: always()
        run: df -hT

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            openwrt/logs/
            openwrt/.config
            release.md
            build-info.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
